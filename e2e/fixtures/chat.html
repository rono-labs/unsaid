<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Chat</title>
    <style>
      body { margin: 0; font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #1f2328; }
      .wrap { max-width: 660px; margin: 0 auto; padding: 32px 20px 160px; }
      #thread p { margin: 0 0 18px; white-space: pre-wrap; }
      #thread .user { margin-left: auto; max-width: 80%; width: fit-content; background: #f1f3f5; padding: 10px 16px; border-radius: 18px; font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
      #thread .assistant { max-width: 90%; }
      .composer { position: fixed; left: 0; right: 0; bottom: 24px; }
      .box { max-width: 660px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; border: 1px solid #d0d7de; border-radius: 22px; padding: 10px 10px 10px 18px; background: #fff; box-shadow: 0 4px 18px rgb(0 0 0 / 0.06); }
      #prompt { flex: 1; min-height: 24px; max-height: 200px; overflow: auto; outline: none; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 15px; }
      #prompt:empty::before { content: "Message"; color: #8b949e; font-family: system-ui, sans-serif; font-size: 15px; }
      #send { border: 0; background: #1f2328; color: #fff; border-radius: 999px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; }
      #plain { position: absolute; left: -9999px; }
      @media (prefers-color-scheme: dark) {
        body { background: #14161c; color: #e8eaef; }
        #thread .user { background: #20232c; }
        .box { border-color: #2c303a; background: #1b1e26; box-shadow: 0 4px 18px rgb(0 0 0 / 0.4); }
        #prompt:empty::before { color: #8b909c; }
        #send { background: #e8eaef; color: #14161c; }
      }
    </style>
  </head>
  <body>
    <div class="wrap"><main id="thread"></main></div>
    <div class="composer">
      <div class="box">
        <div id="prompt" contenteditable="true"></div>
        <button id="send" aria-label="Send">↑</button>
      </div>
    </div>
    <textarea id="plain"></textarea>
    <script>
      const prompt = document.getElementById("prompt");
      prompt.addEventListener("paste", (e) => {
        e.preventDefault();
        prompt.textContent += e.clipboardData.getData("text/plain");
      });
      document.getElementById("send").addEventListener("click", () => {
        const text = prompt.textContent;
        const user = document.createElement("p");
        user.className = "user";
        user.textContent = text;
        document.getElementById("thread").append(user);
        prompt.textContent = "";
        const tags = [...text.matchAll(/<([A-Z_]+_\d+)>/g)].map((m) => m[1]);
        setTimeout(() => {
          const reply = document.createElement("p");
          reply.className = "assistant";
          reply.textContent = "Rotate <" + tags[0] + "> and tell <" + tags[tags.length - 1] + ">.";
          document.getElementById("thread").append(reply);
        }, 200);
      });
    </script>
  </body>
</html>
